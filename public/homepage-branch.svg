<svg width="160" height="620" viewBox="0 0 160 620" xmlns="http://www.w3.org/2000/svg">
  <!-- Branch -->
  <path d="M 20 0 C 40 80, 15 160, 45 240 C 65 300, 30 380, 55 460 C 70 510, 45 570, 60 620"
        stroke="#D9C9A8" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.8"/>

  <!-- Leaves scattered along the branch -->
  <g opacity="0.85">
    <ellipse cx="52" cy="70" rx="18" ry="10" fill="#A8D8B9" transform="rotate(-25 52 70)"/>
    <ellipse cx="18" cy="130" rx="16" ry="9" fill="#BFE3CC" transform="rotate(20 18 130)"/>
    <ellipse cx="58" cy="200" rx="20" ry="11" fill="#A8D8B9" transform="rotate(-15 58 200)"/>
    <ellipse cx="22" cy="270" rx="15" ry="8" fill="#F3D6DC" transform="rotate(30 22 270)"/>
    <ellipse cx="60" cy="330" rx="18" ry="10" fill="#BFE3CC" transform="rotate(-20 60 330)"/>
    <ellipse cx="25" cy="400" rx="16" ry="9" fill="#A8D8B9" transform="rotate(15 25 400)"/>
    <ellipse cx="62" cy="470" rx="17" ry="9" fill="#F3D6DC" transform="rotate(-30 62 470)"/>
    <ellipse cx="30" cy="540" rx="15" ry="8" fill="#BFE3CC" transform="rotate(18 30 540)"/>
  </g>

  <!-- Small pastel blossoms -->
  <g opacity="0.8">
    <circle cx="45" cy="240" r="5" fill="#F3D6DC"/>
    <circle cx="55" cy="460" r="4.5" fill="#F6E2C4"/>
