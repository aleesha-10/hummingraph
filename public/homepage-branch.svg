    <path d="M 0 6 C -6 0, -8 -7, -4 -12 C 2 -8, 4 -1, 2 7 Z" fill="#9FD6C8" opacity="0.9"/>
    <circle cx="11" cy="4" r="5.6" fill="#79B7E0"/>
    <path d="M 16 3.5 L 25 2 L 16.5 5.8 Z" fill="#C98A5B"/>
    <circle cx="12.8" cy="2.4" r="1.1" fill="#4A4A4A"/>
    <path d="M 6.5 7 C 8.7 9.2, 12 9.2, 13.7 7 C 11.5 10.3, 7.7 10.3, 6.5 7 Z" fill="#E88FA6"/>
