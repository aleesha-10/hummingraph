  <!-- Hummingbird perched mid-branch -->
  <g transform="translate(70 190) scale(1.15)">
    <path d="M -8 14 C -14 17, -18 22, -20 28 C -14 26, -8 23, -4 19 Z" fill="#E8B6A8"/>
